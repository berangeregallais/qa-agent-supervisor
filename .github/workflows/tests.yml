name: Agent tests

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # No secret required: every Claude call and pytest subprocess is
      # mocked in the suite (see tests/) — nothing real is ever called here.
      - run: pip install -r requirements.txt

      - run: pytest -v
