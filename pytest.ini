[pytest]
testpaths = tests
filterwarnings =
    # schemas/test_case.py contient les classes Pydantic TestCase/TestCaseList
    # (suggestions de l'Analyste, jamais des tests pytest) : le nom du
    # fichier commence par "test_", donc pytest le scanne par réflexe et
    # émet un faux positif inoffensif. On le connaît, on le filtre.
    ignore:cannot collect test class 'TestCase.*:pytest.PytestCollectionWarning
