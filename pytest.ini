[pytest]
testpaths = tests
filterwarnings =
    # schemas/test_case.py contains the Pydantic classes TestCase/TestCaseList
    # (Analyst suggestions, never pytest tests): the filename starts with
    # "test_", so pytest scans it by reflex and emits a harmless false
    # positive. Known and filtered.
    ignore:cannot collect test class 'TestCase.*:pytest.PytestCollectionWarning
